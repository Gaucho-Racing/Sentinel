<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="x-apple-disable-message-reformatting" />
<meta name="color-scheme" content="light only" />
<title>{{.Heading}}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f5; -webkit-text-size-adjust:100%;">
  <div style="display:none; max-height:0; overflow:hidden; opacity:0;">{{.Preheader}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f4f4f5" style="background-color:#f4f4f5;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px; background-color:#ffffff; border-radius:12px; overflow:hidden;">
          <tr>
            <td bgcolor="#0b0b0f" align="center" style="background-color:#0b0b0f; padding:28px 32px;">
              <img src="https://gauchoracing.com/logo/gr-wordmark-email.png" width="220" height="37" alt="Gaucho Racing" style="display:block; border:0; margin:0 auto; width:220px; height:auto;" />
            </td>
          </tr>
          <tr>
            <td bgcolor="#e105a3" style="height:4px; line-height:4px; font-size:0; background-color:#e105a3; background-image:linear-gradient(90deg, #e105a3, #8412fc);">&nbsp;</td>
          </tr>
          <tr>
            <td align="center" style="padding:36px 32px 8px; font-family:Helvetica, Arial, sans-serif;">
              <h1 style="margin:0 0 12px; font-size:24px; line-height:1.3; font-weight:800; color:#0b0b0f;">{{.Heading}}</h1>
              <p style="margin:0; font-size:16px; line-height:1.6; color:#3f3f46;">{{.Intro}}</p>
            </td>
          </tr>
          {{if .Code}}
          <tr>
            <td align="center" style="padding:24px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="background-color:#faf5ff; border:1px solid #ede9fe; border-radius:10px;">
                <tr>
                  <td align="center" style="padding:18px 28px; font-family:'SFMono-Regular', Menlo, Consolas, 'Courier New', monospace; font-size:36px; font-weight:700; letter-spacing:10px; color:#0b0b0f;">
                    {{.Code}}
                  </td>
                </tr>
              </table>
              <p style="margin:14px 0 0; font-family:Helvetica, Arial, sans-serif; font-size:13px; color:#71717a;">This code expires in {{.Minutes}} minutes.</p>
            </td>
          </tr>
          {{end}}
          <tr>
            <td align="center" style="padding:{{if .Code}}8px{{else}}24px{{end}} 32px 32px; font-family:Helvetica, Arial, sans-serif; font-size:14px; line-height:1.6; color:#71717a;">
              {{.Note}}
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:20px 32px; border-top:1px solid #f4f4f5; font-family:Helvetica, Arial, sans-serif; font-size:12px; line-height:1.6; color:#a1a1aa;">
              Gaucho Racing &middot; UC Santa Barbara's Formula SAE team<br />
              Questions? <a href="mailto:team@gauchoracing.com" style="color:#8412fc; text-decoration:underline;">team@gauchoracing.com</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
